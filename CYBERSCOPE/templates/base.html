<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CyberScope-AI SIEM</title>
    <!-- Link to our newly updated CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/cyberscope.css') }}">
</head>
<body>
    
    <!-- Modern Vertical Sidebar Navigation -->
    <nav class="sidebar">
        <h2>🛡️ CyberScope-AI</h2>
        
        <div class="nav-links" style="display: flex; flex-direction: column; height: 100%; margin-top: 1rem;">
            <a href="{{ url_for('dashboard') }}" class="{% if active_page == 'dashboard' %}active{% endif %}">
                📊 Dashboard
            </a>
            <a href="{{ url_for('incidents_view') }}" class="{% if active_page == 'incidents' %}active{% endif %}">
                🚨 Incidents
            </a>
            <a href="{{ url_for('analyzer_view') }}" class="{% if active_page == 'analyzer' %}active{% endif %}">
                📂 Log Analyzer
            </a>
            <a href="{{ url_for('analytics_view') }}" class="{% if active_page == 'analytics' %}active{% endif %}">
                📈 Analytics
            </a>
            
            <!-- Spacer to push the logout button to the very bottom of the screen -->
            <div style="flex-grow: 1;"></div> 
            
            <a href="{{ url_for('logout') }}" style="color: var(--accent-red); text-align: center; border: 1px solid rgba(248, 113, 113, 0.3); border-radius: 6px; padding: 0.6rem;">
                🚪 Logout
            </a>
        </div>
    </nav>

    <!-- Main Content Area where all other pages load -->
    <main class="main-content">
        {% block content %}
        <!-- Child templates will inject their content here -->
        {% endblock %}
    </main>

</body>
</html>
