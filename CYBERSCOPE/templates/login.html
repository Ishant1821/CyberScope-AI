<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login - CyberScope-AI</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/cyberscope.css') }}">
    <style>
        body { 
            display: flex; justify-content: center; align-items: center; 
            height: 100vh; background: #0f172a; margin: 0; font-family: 'Inter', sans-serif;
        }
        .login-card { 
            background: #1e293b; padding: 3rem; border-radius: 8px; 
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5); 
            width: 100%; max-width: 350px; text-align: center; border: 1px solid #334155;
        }
        .login-card input { 
            width: 100%; padding: 0.8rem; margin-bottom: 1rem; border: 1px solid #334155; 
            background: #0f172a; color: white; border-radius: 4px; box-sizing: border-box; 
        }
        .login-card button { 
            width: 100%; padding: 0.8rem; background: #38bdf8; color: #000; 
            border: none; font-weight: bold; border-radius: 4px; cursor: pointer; 
        }
    </style>
</head>
<body>
    <div class="login-card">
        <h2 style="color: white; margin-bottom: 0.2rem;">CyberScope-AI</h2>
        <p style="color: #94a3b8; margin-bottom: 2rem; font-size: 0.9rem;">Authorized Personnel Only</p>
        
        {% if error %}
        <div style="background: rgba(248, 113, 113, 0.1); color: #f87171; padding: 0.8rem; border-radius: 4px; margin-bottom: 1rem; font-size: 0.9rem;">
            {{ error }}
        </div>
        {% endif %}
        
        <form method="POST" action="{{ url_for('login') }}">
            <input type="text" name="username" placeholder="Username" required>
            <input type="password" name="password" placeholder="Password" required>
            <button type="submit">Access Dashboard</button>
        </form>
    </div>
</body>
</html>
